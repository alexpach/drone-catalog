<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drone Company Index</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --text: #1d1f21; --muted: #6b6f76;
    --border: #e2e2de; --head: #f0f0ec; --hover: #f3f6fb; --accent: #2f5fb3;
    --live: #1f7a4d; --live-bg: #e3f3ea; --gone: #a33a2b; --gone-bg: #f8e5e1;
    --acq: #8a5a00; --acq-bg: #fbf0d9; --unk: #5d6470; --unk-bg: #ececec;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141517; --panel: #1b1d20; --text: #e6e6e3; --muted: #9a9ea6;
      --border: #2c2f34; --head: #22252a; --hover: #232a35; --accent: #7aa7ff;
      --live: #6fd39f; --live-bg: #183427; --gone: #f08c7c; --gone-bg: #3a1f1b;
      --acq: #f0c060; --acq-bg: #3a2f17; --unk: #b4b8c0; --unk-bg: #2a2d32;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header { padding: 20px 20px 12px; }
  h1 { margin: 0 0 4px; font-size: 20px; font-weight: 650; }
  .sub { color: var(--muted); }
  .bar {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    padding: 0 20px 12px;
  }
  .bar input[type=search] {
    flex: 1 1 260px; max-width: 420px; padding: 7px 10px; font: inherit;
    border: 1px solid var(--border); border-radius: 6px; background: var(--panel); color: var(--text);
  }
  button {
    padding: 7px 12px; font: inherit; cursor: pointer; border-radius: 6px;
    border: 1px solid var(--border); background: var(--panel); color: var(--text);
  }
  button:hover { border-color: var(--accent); }
  .count { color: var(--muted); margin-left: auto; font-variant-numeric: tabular-nums; }
  .wrap {
    margin: 0 20px 24px; overflow: auto; max-height: calc(100vh - 140px);
    border: 1px solid var(--border); border-radius: 8px; background: var(--panel);
  }
  table { border-collapse: separate; border-spacing: 0; width: max-content; min-width: 100%; }
  th, td { padding: 6px 10px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
  thead th { position: sticky; background: var(--head); z-index: 2; }
  thead tr.titles th { top: 0; cursor: pointer; user-select: none; white-space: nowrap; font-weight: 600; }
  thead tr.filters th { top: 31px; padding-top: 0; }
  thead tr.titles th:hover { color: var(--accent); }
  .arrow { display: inline-block; width: 1em; color: var(--accent); }
  .filters input, .filters select {
    width: 100%; min-width: 90px; padding: 4px 6px; font: inherit; font-size: 12px;
    border: 1px solid var(--border); border-radius: 4px; background: var(--panel); color: var(--text);
  }
  .filters .active { border-color: var(--accent); }
  tbody tr:hover td { background: var(--hover); }
  td.name { font-weight: 600; white-space: nowrap; position: sticky; left: 0; background: var(--panel); z-index: 1; }
  th.name { position: sticky; left: 0; z-index: 3; }
  td.notes { min-width: 320px; max-width: 520px; white-space: normal; }
  td.industry, td.parent_or_acquirer { min-width: 180px; max-width: 260px; }
  td.domain, td.evidence_url, td.status_source { white-space: nowrap; }
  td.unknown { color: var(--muted); font-style: italic; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .s-live { color: var(--live); background: var(--live-bg); }
  .s-gone { color: var(--gone); background: var(--gone-bg); }
  .s-acquired { color: var(--acq); background: var(--acq-bg); }
  .s-unknown { color: var(--unk); background: var(--unk-bg); }
  .msg { padding: 24px; color: var(--muted); }
  @media (max-width: 600px) {
    header, .bar { padding-left: 16px; padding-right: 16px; }
    .wrap { margin: 0 16px 16px; }
    .count { margin-left: 0; width: 100%; }
  }
</style>
</head>
<body>
<header>
  <h1>Drone Company Index</h1>
  <div class="sub">Viewer for <a href="companies.csv">companies.csv</a>. Click a column title to sort; type or pick in the row below it to filter.</div>
</header>
<div class="bar">
  <input type="search" id="q" placeholder="Search all columns…" aria-label="Search all columns">
  <button id="clear">Clear filters</button>
  <span class="count" id="count"></span>
</div>
<div class="wrap"><table id="t"><thead></thead><tbody><tr><td class="msg">Loading companies.csv…</td></tr></tbody></table></div>

<script>
// Columns with at most this many distinct values get a dropdown filter.
const SELECT_MAX = 12;
const LINK_COLS = new Set(['evidence_url', 'status_source']);

function parseCSV(text) {
  const rows = []; let row = [], field = '', quoted = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (quoted) {
      if (c === '"' && text[i + 1] === '"') { field += '"'; i++; }
      else if (c === '"') quoted = false;
      else field += c;
    } else if (c === '"') quoted = true;
    else if (c === ',') { row.push(field); field = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i + 1] === '\n') i++;
      row.push(field); rows.push(row); row = []; field = '';
    } else field += c;
  }
  if (field || row.length) { row.push(field); rows.push(row); }
  return rows.filter(r => r.some(v => v !== ''));
}

const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const isBlank = v => v === '' || v.toLowerCase() === 'unknown';

let cols = [], data = [], sort = { col: null, dir: 1 };
const filters = {};

function cell(col, v) {
  if (v === '') return '<td class="' + col + '"></td>';
  if (v.toLowerCase() === 'unknown') return '<td class="' + col + ' unknown">unknown</td>';
  let html = esc(v);
  if (col === 'status') html = '<span class="pill s-' + esc(v) + '">' + esc(v) + '</span>';
  else if (col === 'domain') html = '<a href="https://' + esc(v) + '" target="_blank" rel="noopener">' + esc(v) + '</a>';
  else if (LINK_COLS.has(col) && /^https?:\/\//.test(v)) {
    let label = v;
    try { label = new URL(v).hostname.replace(/^www\./, ''); } catch (e) {}
    html = '<a href="' + esc(v) + '" target="_blank" rel="noopener" title="' + esc(v) + '">' + esc(label) + '</a>';
  }
  return '<td class="' + col + '">' + html + '</td>';
}

function compare(a, b, col) {
  const x = a[col], y = b[col];
  // Blank and "unknown" always sort last, whichever direction.
  if (isBlank(x) !== isBlank(y)) return isBlank(x) ? 1 : -1;
  const nx = Number(x), ny = Number(y);
  const r = x !== '' && y !== '' && !isNaN(nx) && !isNaN(ny) ? nx - ny
    : x.localeCompare(y, undefined, { sensitivity: 'base', numeric: true });
  return r * sort.dir;
}

function render() {
  const q = document.getElementById('q').value.trim().toLowerCase();
  let rows = data.filter(r => {
    if (q && !cols.some(c => r[c].toLowerCase().includes(q))) return false;
    return cols.every(c => {
      const f = filters[c];
      if (!f) return true;
      return f.exact ? r[c] === f.value : r[c].toLowerCase().includes(f.value);
    });
  });
  if (sort.col) rows = rows.slice().sort((a, b) => compare(a, b, sort.col));
  document.querySelector('#t tbody').innerHTML = rows.length
    ? rows.map(r => '<tr>' + cols.map(c => cell(c, r[c])).join('') + '</tr>').join('')
    : '<tr><td class="msg" colspan="' + cols.length + '">No companies match these filters.</td></tr>';
  document.getElementById('count').textContent = rows.length === data.length
    ? data.length + ' companies' : rows.length + ' of ' + data.length + ' companies';
  document.querySelectorAll('thead tr.titles th').forEach(th => {
    th.querySelector('.arrow').textContent = th.dataset.col === sort.col ? (sort.dir > 0 ? '▲' : '▼') : '';
  });
}

function buildHead() {
  const titles = cols.map(c =>
    '<th class="' + c + '" data-col="' + c + '">' + esc(c.replace(/_/g, ' ')) + ' <span class="arrow"></span></th>').join('');
  const inputs = cols.map(c => {
    const values = [...new Set(data.map(r => r[c]))].sort((a, b) => a.localeCompare(b));
    if (values.length <= SELECT_MAX) {
      const opts = values.map(v => '<option value="' + esc(v) + '">' + (v === '' ? '(blank)' : esc(v)) + '</option>').join('');
      return '<th class="' + c + '"><select data-col="' + c + '" aria-label="Filter ' + c + '"><option value="__all">All</option>' + opts + '</select></th>';
    }
    return '<th class="' + c + '"><input type="search" data-col="' + c + '" placeholder="Filter" aria-label="Filter ' + c + '"></th>';
  }).join('');
  document.querySelector('#t thead').innerHTML =
    '<tr class="titles">' + titles + '</tr><tr class="filters">' + inputs + '</tr>';
  // Pin the filter row directly under the title row, whatever its rendered height.
  const titleHeight = document.querySelector('thead tr.titles').getBoundingClientRect().height;
  document.querySelectorAll('thead tr.filters th').forEach(th => { th.style.top = titleHeight + 'px'; });

  document.querySelectorAll('thead tr.titles th').forEach(th => th.addEventListener('click', () => {
    const col = th.dataset.col;
    // Cycle: ascending -> descending -> original order.
    if (sort.col !== col) sort = { col, dir: 1 };
    else if (sort.dir === 1) sort.dir = -1;
    else sort = { col: null, dir: 1 };
    render();
  }));
  document.querySelectorAll('thead tr.filters input, thead tr.filters select').forEach(el => {
    el.addEventListener('input', () => {
      const col = el.dataset.col, v = el.value;
      if (el.tagName === 'SELECT') filters[col] = v === '__all' ? null : { exact: true, value: v };
      else filters[col] = v.trim() ? { exact: false, value: v.trim().toLowerCase() } : null;
      el.classList.toggle('active', !!filters[col]);
      render();
    });
  });
}

document.getElementById('q').addEventListener('input', render);
document.getElementById('clear').addEventListener('click', () => {
  document.getElementById('q').value = '';
  document.querySelectorAll('thead tr.filters input').forEach(el => { el.value = ''; el.classList.remove('active'); });
  document.querySelectorAll('thead tr.filters select').forEach(el => { el.value = '__all'; el.classList.remove('active'); });
  for (const k in filters) filters[k] = null;
  sort = { col: null, dir: 1 };
  render();
});

fetch('companies.csv', { cache: 'no-cache' })
  .then(r => { if (!r.ok) throw new Error(r.status + ' ' + r.statusText); return r.text(); })
  .then(text => {
    const [header, ...body] = parseCSV(text);
    cols = header;
    data = body.map(r => Object.fromEntries(cols.map((c, i) => [c, r[i] ?? ''])));
    buildHead();
    render();
  })
  .catch(err => {
    document.querySelector('#t tbody').innerHTML =
      '<tr><td class="msg">Could not load companies.csv (' + esc(String(err.message || err)) +
      '). If you opened this file directly, serve the folder instead: <code>python3 -m http.server</code>.</td></tr>';
  });
</script>
</body>
</html>
