<svg xmlns="http://www.w3.org/2000/svg" viewBox="-60.42 0 243.364 243.364">
	<!--
		The Perennial Autonomy mark.

		The artwork is 122.5 x 243.4, so the viewBox is the mark's own height
		squared up around it: the mark runs edge to edge vertically (the tight
		dimension in a square favicon slot) and centres horizontally.

		One file serves both browser themes. An SVG favicon is rendered as its
		own document, so the media query below reads the OS/browser theme, NOT
		the page's colour scheme: black on light chrome, stone on dark. Chrome
		and Firefox honour it; anywhere it is ignored the black default stands.
	-->
	<style>
		path { fill: #000; }

		@media (prefers-color-scheme: dark) {
			path { fill: #D0D0D0; }
		}
	</style>
